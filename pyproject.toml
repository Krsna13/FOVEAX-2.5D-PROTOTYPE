[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foveax-trail"
version = "0.1.0"
description = "Deterministic 2.5D Adaptive Variable-Resolution LiDAR Mapping and Terrain Traversability for Off-Road Autonomous Navigation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FOVEAX Team" }
]
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "open3d==0.19.0",
    "opencv-python==5.0.0.93",
    "matplotlib==3.11.1",
    "PyQt5==5.15.11",
    "PyYAML==6.0.3",
    "psutil==7.2.2",
    "tqdm==4.70.0",
    "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]
# For GPU deep learning models, install PyTorch cu130:
# pip install torch==2.14.0+cu130 torchvision==0.29.0+cu130 --extra-index-url https://download.pytorch.org/whl/cu130

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning",
]
