[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foveax-trail"
version = "0.1.0"
description = "Deterministic 2.5D Adaptive Variable-Resolution LiDAR Mapping and Terrain Traversability for Off-Road Autonomous Navigation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FOVEAX Team" }
]
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.12.0",
    "open3d>=0.18.0",
    "opencv-python>=4.8.0",
    "matplotlib>=3.8.0",
    "PyQt5>=5.15.10",
    "PyYAML>=6.0.0",
    "psutil>=5.9.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
# For GPU deep learning models, install PyTorch cu130:
# pip install torch==2.14.0+cu130 torchvision==0.29.0+cu130 --extra-index-url https://download.pytorch.org/whl/cu130

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning",
]
